    <!-- Pairs with public/404.html: restores the real path (encoded there
         as ?p=) before React Router mounts, so a direct visit or refresh on
         a deep link works the same as a normal navigation would. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var real = params.get("p");
        if (real) {
          window.history.replaceState(null, "", real);
        }
      })();
    </script>
